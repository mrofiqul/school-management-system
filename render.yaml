# Render Blueprint — in Render: New → Blueprint → connect this repo → it
# reads this file and provisions both the API and its database together.
# No secrets live here; JWT_ACCESS_SECRET and PAYMENT_WEBHOOK_SECRET are
# generated by Render itself at provision time (generateValue: true).
services:
  - type: web
    name: campus-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://campustime.infinityfreeapp.com
      - key: NODE_ENV
        value: production

databases:
  - name: campus-db
    plan: free
    databaseName: campus
    user: campus
